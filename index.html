<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FitPlan Pro">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=8.0.0">
<title>FitPlan Pro V8</title>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">FP</div>
      <div>
        <div class="eyebrow">FITPLAN PRO</div>
        <div class="brand-title">Günlük sağlık panelin</div>
      </div>
    </div>
    <button class="profile-mini" id="profileMini" aria-label="Profil" onclick="nav('profile')">
      <span id="profileInitial">S</span>
    </button>
  </div>
</header>

<main id="app"></main>

<nav class="nav" aria-label="Ana menü">
  <button data-page="home"><span class="nav-icon">⌂</span><span>Bugün</span></button>
  <button data-page="plan"><span class="nav-icon">◉</span><span>Plan</span></button>
  <button data-page="scan"><span class="nav-icon">⌁</span><span>Analiz</span></button>
  <button data-page="coach"><span class="nav-icon">✦</span><span>AI Koç</span></button>
  <button data-page="profile"><span class="nav-icon">○</span><span>Profil</span></button>
</nav>
<div id="toast" class="toast"></div>
<script src="config.js"></script>
<script src="app.js?v=8.0.0"></script>
</body>
</html>
